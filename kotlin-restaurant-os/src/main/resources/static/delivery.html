<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restro · Delivery kitchen</title><style>body{margin:0;background:#101113;color:#f8f6f2;font:16px system-ui}main{max-width:960px;margin:auto;padding:32px}a{color:#ff946c}article{padding:24px;border:1px solid #ffffff22;border-radius:20px;margin:20px 0;background:#252629}button{padding:14px 20px;border:0;border-radius:12px;background:#ff946c;color:#101113;font:inherit;cursor:pointer;min-height:48px}button:disabled{opacity:.5;cursor:wait}p{line-height:1.6}#status{min-height:24px;color:#ffb59a}h1{font-size:36px}small{color:#b8b7b3}</style></head><body><main><a href="/">← Restaurant OS</a><h1>Delivery kitchen</h1><p>Confirmed customer orders. Advance a status only when the real-world step is complete. Marking delivered confirms cash collection.</p><button id="refresh">Refresh orders</button><p id="status" role="status"></p><section id="orders"></section></main><script>
const next={Confirmed:'Preparing',Preparing:'Ready',Ready:'Out for delivery','Out for delivery':'Delivered'};
const node=(tag,text)=>{const el=document.createElement(tag);el.textContent=text;return el};
async function request(path,options){const r=await fetch('/api/delivery/staff/'+path,options);if(!r.ok)throw Error('Unable to update orders. Check your staff session and retry.');return r.json()}
async function refresh(){const status=document.getElementById('status');status.textContent='Loading orders…';try{const data=await request('orders');const host=document.getElementById('orders');host.replaceChildren();for(const {owner,order} of data.sort((a,b)=>b.order.events[0].at.localeCompare(a.order.events[0].at))){const card=node('article','');card.append(node('h2',order.restaurantName+' · '+order.id.slice(0,8)),node('p',order.status+' · '+new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(order.quote.total/100)),node('p',order.quote.lines.map(l=>l.quantity+' × '+l.name+(l.addons.length?' ('+l.addons.join(', ')+')':'')).join(' · ')),node('p',order.address.line+', '+order.address.city+' '+order.address.postcode),node('small',order.address.phone+' · '+order.paymentStatus));if(next[order.status]){const button=node('button','Mark '+next[order.status]);button.onclick=async()=>{button.disabled=true;try{await request('orders/'+encodeURIComponent(owner)+'/'+encodeURIComponent(order.id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:next[order.status]})});await refresh()}catch(e){status.textContent=e.message;button.disabled=false}};card.append(node('p',''),button)}host.append(card)}status.textContent=data.length?'Updated '+new Date().toLocaleTimeString():'No delivery orders yet.'}catch(e){status.textContent=e.message}}
document.getElementById('refresh').onclick=refresh;refresh();
</script></body></html>
