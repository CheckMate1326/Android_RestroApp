spring.application.name=restaurant-os
spring.datasource.url=${RESTRO_DATABASE_URL:jdbc:h2:file:./data/restro;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${RESTRO_DATABASE_USER:sa}
spring.datasource.password=${RESTRO_DATABASE_PASSWORD:}
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.address=${RESTRO_BIND_ADDRESS:0.0.0.0}
server.max-http-request-header-size=16KB
spring.servlet.multipart.max-request-size=1MB
